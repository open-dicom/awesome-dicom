name: Link check

on:
  schedule:
    - cron: "17 6 * * 1" # 06:17 UTC every Monday, off the hour, when GitHub delays scheduled runs
  workflow_dispatch:
  # Run on pull requests that change the check, to test it. Those runs fail on broken links
  # and don't touch issues.
  pull_request:
    paths:
      - .github/workflows/links.yml
      - .github/scripts/update_report_issue.sh
      - .lycheeignore

permissions:
  contents: read

env:
  ISSUE_TITLE: "Link check: broken links"

jobs:
  check-links:
    # lychee-action downloads and runs the lychee binary unverified, so this job's token can only
    # read. lychee's output still decides the status and report that update-issue posts, so a
    # compromised binary could at worst close or rewrite the link-check tracking issue.
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200..=299,429
            readme.md archive.md contributing.md
          output: lychee-report.md
          fail: false

      - name: Record the result
        id: result
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          case "$LYCHEE_EXIT_CODE" in
            0) status=passed ;;
            2) status=found-problems ;; # lychee found broken links
            *) status=failed ;; # lychee itself failed
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          report_delimiter="REPORT_$(openssl rand -hex 16)"
          {
            echo "report<<$report_delimiter"
            cat lychee-report.md 2>/dev/null || true
            echo # Make sure the delimiter starts its own line.
            echo "$report_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Fail the run unless every link passed, when no issue will be updated
        # On main, update-issue reports problems in the issue and fails the run if lychee failed.
        # Everywhere else (pull requests, manual runs on other branches) this step does it.
        if: >-
          steps.result.outputs.status != 'passed' &&
          (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        run: |
          cat lychee-report.md 2>/dev/null || true
          exit 1

  update-issue:
    # Only runs on main's list update the tracking issue: never pull requests or other branches.
    needs: check-links
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ needs.check-links.outputs.status }}
          REPORT: ${{ needs.check-links.outputs.report }}
        run: |
          printf '%s\n' "$REPORT" > lychee-report.md
          bash .github/scripts/update_report_issue.sh "$ISSUE_TITLE" lychee-report.md "$CHECK_STATUS"
