name: Report a problem with an entry
description: Report a broken link, an outdated description, or a project that is archived or no longer maintained.
labels: ["mistake"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry
      description: The name of the entry, as it appears in the list.
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options:
        - Broken link
        - Archived or no longer maintained
        - Description is wrong or out of date
        - In the wrong section
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and where you found out, such as a link to the project's own announcement.
    validations:
      required: true
